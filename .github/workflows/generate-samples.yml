name: Verify codec and publish demo WAV files

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-samples.yml"
      - "gibber.py"
      - "requirements.txt"
      - "tests/**"
      - "scripts/generate_samples.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Run codec tests
        run: python -m unittest discover -s tests -v
      - name: Generate and verify WAV files
        run: python scripts/generate_samples.py
      - name: Verify decoded message
        run: python gibber.py decode samples/gibber_fries.wav
      - name: Commit generated WAV files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add samples/gibber_fries.wav samples/gibber_fries_repeat_4x.wav
          if ! git diff --cached --quiet; then
            git commit -m "Add verified demo WAV audio"
            git push
          fi
